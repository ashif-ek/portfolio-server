name: Keep Render App Awake

on:
  schedule:
    - cron: "*/8 * * * *"   # every 8 minutes
  workflow_dispatch:       # manual trigger (optional)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s https://portfolio-server-35.onrender.com/health > /dev/null
